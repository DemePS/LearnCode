name: Deploy

# Ships LearnCode to a single Linux host on every push to main, with no cloud console step: the host
# runs the same compose file used locally, and everything it needs is in this repository.
#
#   1. test   -- the suite from ci.yml (called as a reusable workflow, so it runs exactly once)
#   2. image  -- build and push to GitHub Container Registry (free for public packages)
#   3. deploy -- ssh to the host, pull the pinned image, restart against the data volume
#
# What you must do once, by hand (nothing below can create these):
#   * create the host and install Docker
#   * add repository variables/secrets: see deploy/README.md
#   * write /opt/learncode/.env on the host with the model key and the OAuth app
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false   # never cut a deploy off half-way

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR with the workflow's own token -- no registry secret needed
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects upper-case paths and GitHub usernames may contain capitals, while Actions has no
      # lowercase() function -- so the name is normalised here rather than interpolated inline.
      - name: Resolve image name
        id: meta
        run: |
          name="ghcr.io/${{ github.repository_owner }}/learncode"
          echo "name=$(echo "$name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A moving tag for convenience, plus the exact commit so a deploy can be pinned to one build
          # and rolled back without rebuilding.
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # Without the host secrets this job could only fail on every push; the variable makes the switch
    # explicit instead of turning the pipeline red until someone configures it.
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Only the compose files travel. .env is NOT sent: it holds the model key and the OAuth client
      # secret, and a secret that passes through CI is a secret inside CI's blast radius.
      - name: Copy the compose files to the host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,deploy-compose.prod.yml"
          target: "/opt/learncode"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_SHA: ${{ needs.image.outputs.name }}:${{ github.sha }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_SHA,ACTOR,GH_TOKEN
          script: |
            set -eu
            cd /opt/learncode
            test -f .env || { echo "missing /opt/learncode/.env on the host"; exit 1; }
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            # Pinned to the commit this run built, so a cached `latest` cannot deploy an older image.
            export LEARNCODE_IMAGE="$IMAGE_SHA"
            compose="docker compose -f docker-compose.yml -f deploy-compose.prod.yml"
            $compose pull
            $compose up -d --remove-orphans
            # A started container is not a working one: wait for its health check before reporting success.
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$($compose ps -q learncode)" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then echo "deployed $IMAGE_SHA, healthy"; exit 0; fi
              sleep 2
            done
            echo "container did not become healthy; recent logs:"
            $compose logs --tail=80 learncode
            exit 1
