[project]
name = "learncode-backend"
version = "0.1.0"
description = "FastAPI backend for LearnCode: a project-based coding-practice app whose pages are generated at runtime by seedagent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    # No [browser] extra: the web_* tools it pulls in drive one process-wide browser, which cannot
    # serve several learners at once, so the instructor no longer offers them (see app/agent.py).
    # No [excel] extra either: nothing here writes spreadsheets.
    "seedagent",
    "sqlalchemy>=2.0,<3",
    "cryptography>=43",
    "python-dotenv>=1",
]

[tool.uv.sources]
# keyed_sessions is what makes concurrent turns possible (per-session state instead of module
# globals); the published seedagent has no such branch. Switch back to a plain "seedagent" version
# requirement, and delete this block, once keyed_sessions is merged and released.
seedagent = { git = "https://github.com/DemePS/CodeAgent", branch = "keyed_sessions" }

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-timeout>=2.3",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Only our own tests. data/workspaces holds the repositories learners clone (each with its own tests/ and
# often its own pyproject.toml), and without this pytest collects them too and dies on whatever they
# import -- yfinance, in the first real clone -- which looks like a failure of this project's suite.
testpaths = ["tests"]
norecursedirs = ["data", ".venv", "*.egg"]
# CI runs this file; a test that hangs must fail the build rather than hold the runner for hours. The
# suite used to hang outright on a looping model reply (fixed in app/agent.py), and without a timeout
# that showed up as a job that never ended.
addopts = "--timeout=120"

[tool.hatch.build.targets.wheel]
packages = ["app"]
