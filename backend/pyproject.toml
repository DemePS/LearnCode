[project]
name = "learncode-backend"
version = "0.1.0"
description = "FastAPI backend for LearnCode: a project-based coding-practice app whose pages are generated at runtime by seedagent"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "seedagent[browser,excel]>=1.1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
